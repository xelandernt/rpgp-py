# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.8"
hooks = [
  {
    id = "ruff",
    name = "ruff",
    files = "^src|^tests",
    args = ["--fix"]
  },
  {
    id = "ruff-format",
    files = "^src|^tests"
  }
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "end-of-file-fixer", exclude = "^tests/fixtures/" },
  { id = "mixed-line-ending", exclude = "^tests/fixtures/" }
]


[[repos]]
repo = "local"
hooks = [
    {
    id = "just-format",
    name = "just format",
    entry = "just --unstable --fmt",
    language = "system",
    pass_filenames = false
    },
    {
    id = "type",
    name ="type",
    entry = "just typecheck",
    language = "system",
    pass_filenames = false
    },
    {
    id = "rust-check",
    name = "rust check",
    entry = "cargo check",
    language = "system",
    pass_filenames = false
    },
    {
    id = "rust-fmt",
    name = "rust fmt",
    entry = "cargo fmt",
    language = "system",
    pass_filenames = false
    },
    {
    id = "rust-lint",
    name = "rust lint",
    entry = "cargo clippy --workspace -- --deny warnings",
    language = "system",
    pass_filenames = false
    },
]
